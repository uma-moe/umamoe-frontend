name: Sync Timeline Images

on:
  schedule:
    # Runs after the resources archive's 13:00 JST metadata check.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-timeline-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Check out resources
        uses: actions/checkout@v4
        with:
          repository: uma-moe/umamoe-resources
          ref: main
          path: .sync/umamoe-resources

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install image converter
        run: npm ci

      - name: Download deployed beta timeline
        shell: bash
        run: |
          curl --fail --location --retry 4 --compressed \
            https://beta.uma.moe/resources/current/banner_timeline.json.gz \
            --output "${RUNNER_TEMP}/banner_timeline.json"

      - name: Sync timeline images and available EN replacements
        shell: bash
        run: |
          node .sync/umamoe-resources/scripts/sync_umapyoi_timeline_images.mjs \
            --timeline-json "${RUNNER_TEMP}/banner_timeline.json" \
            --frontend-root . \
            --request-interval-ms 250 \
            --changed-files-output "${RUNNER_TEMP}/timeline-image-changes.txt"

      - name: Commit changed WebP assets
        shell: bash
        run: |
          changes="${RUNNER_TEMP}/timeline-image-changes.txt"
          if [[ ! -s "${changes}" ]]; then
            echo "Timeline images are already current."
            exit 0
          fi
          while IFS= read -r path; do
            [[ -n "${path}" ]] && git add -f -- "${path}"
          done < "${changes}"
          if git diff --cached --quiet; then
            echo "Timeline images are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync timeline images"
          git push origin HEAD:beta
