name: Sync Timeline Images

on:
  schedule:
    # Leave time for the resources archive and generated timeline to deploy first.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-timeline-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: beta
            timeline_url: https://beta.uma.moe/resources/current/banner_timeline.json.gz
            site_origin: https://beta.uma.moe
          - branch: main
            timeline_url: https://uma.moe/resources/current/banner_timeline.json.gz
            site_origin: https://uma.moe
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Check out resources
        uses: actions/checkout@v4
        with:
          repository: uma-moe/umamoe-resources
          ref: main
          path: .sync/umamoe-resources

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install image converter
        run: npm ci

      - name: Download deployed timeline
        shell: bash
        run: |
          curl --fail --location --retry 4 --compressed \
            --header "Origin: ${{ matrix.site_origin }}" \
            --referer "${{ matrix.site_origin }}/timeline" \
            "${{ matrix.timeline_url }}" \
            --output "${RUNNER_TEMP}/banner_timeline.json"

      - name: Sync timeline images and available EN replacements
        shell: bash
        run: |
          node .sync/umamoe-resources/scripts/sync_umapyoi_timeline_images.mjs \
            --timeline-json "${RUNNER_TEMP}/banner_timeline.json" \
            --frontend-root . \
            --request-interval-ms 250 \
            --changed-files-output "${RUNNER_TEMP}/timeline-image-changes.txt"

      - name: Commit changed WebP assets
        id: commit
        shell: bash
        run: |
          changes="${RUNNER_TEMP}/timeline-image-changes.txt"
          if [[ ! -s "${changes}" ]]; then
            echo "Timeline images are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            [[ -n "${path}" ]] && git add -f -- "${path}"
          done < "${changes}"
          if git diff --cached --quiet; then
            echo "Timeline images are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync timeline images"
          git push origin "HEAD:${{ matrix.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated artwork
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-image.yml --ref "${{ matrix.branch }}" --field deploy_assets=true
