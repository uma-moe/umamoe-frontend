name: Component formatting

on:
  pull_request:
    paths:
      - 'src/**/*.svelte'
      - 'src/**/*.css'
      - '.prettierrc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/format.yml'
  push:
    paths:
      - 'src/**/*.svelte'
      - 'src/**/*.css'
      - '.prettierrc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
